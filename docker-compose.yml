services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: paas
      POSTGRES_PASSWORD: paas
      POSTGRES_DB: paas
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paas -d paas"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://paas:paas@db:5432/paas
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
