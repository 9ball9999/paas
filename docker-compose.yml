services:
  db:
    image: postgres:16-alpine
    container_name: paas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paas}
      POSTGRES_DB: ${POSTGRES_DB:-paas}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paas -d paas"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paas-api
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+psycopg://paas:paas@db:5432/paas
      - GITLAB_MODE=${GITLAB_MODE:-fake}
      - ORCHESTRATOR_MODE=${ORCHESTRATOR_MODE:-mock}
      - AUTH_MODE=${AUTH_MODE:-dev}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-change-me-long-random}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-change-me-long-random}
      - WEBHOOK_PUBLIC_URL=${WEBHOOK_PUBLIC_URL:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: paas-pgdata
